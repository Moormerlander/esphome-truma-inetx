# Truma iNet X -> Home Assistant, directly via an ESP32
# Truma iNet X -> Home Assistant, direkt per ESP32
#
# The ESP connects to the iNet X panel over Bluetooth and keeps the connection.
# Der ESP verbindet sich per Bluetooth mit dem iNet-X-Panel und hält die Verbindung.
#
# Read the README before pairing / vor dem Koppeln die README lesen.
#
# LANGUAGE / SPRACHE: change "de" to "en" (or back) in the line below
# ("packages: language: ..."). It sets all entity names, the device names and
# the status texts. / In der Zeile unten "de" gegen "en" tauschen. Das stellt
# alle Entitätsnamen, die Gerätenamen und die Statustexte um.

packages:
  language: github://Moormerlander/esphome-truma-inetx/lang/de.yaml@v0.8.4
  # Without GitHub access / ohne GitHub: put lang/de.yaml next to this file and use
  #   language: !include lang/de.yaml

esphome:
  name: truma-inetx
  friendly_name: Truma iNet X
  min_version: 2026.11.0

  # Sub-devices: in Home Assistant the entities are split across these devices.
  # Everything without device_id stays on the ESP itself (connection & diagnostics).
  devices:
    - id: truma_heizung
      name: "${truma_heater}"
      relation: via
    - id: truma_bordnetz
      name: "${truma_power}"
      relation: via
    - id: truma_panel
      name: "${truma_panel}"
      relation: via
    # Truma LevelControl gas bottles (up to two). Without LevelControl the values
    # stay empty. / Ohne LevelControl bleiben die Werte leer.
    - id: truma_gas_1
      name: "${truma_gas_1}"
      relation: via
    - id: truma_gas_2
      name: "${truma_gas_2}"
      relation: via

esp32:
  board: esp32dev          # classic ESP32 -- NOT C3/S3/C6, see README
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Truma Fallback Hotspot"
    password: !secret fallback_password

captive_portal:

# --- Truma iNet X ---------------------------------------------------------
external_components:
  - source: github://Moormerlander/esphome-truma-inetx@v0.8.4
    components: [truma_inetx]
  # Local instead of GitHub: put the "components" folder next to this file and use
  #   - source: { type: local, path: components }

time:
  - platform: homeassistant
    id: ha_time

esp32_ble_tracker:
  scan_parameters:
    active: true

truma_inetx:
  id: truma_hub
  time_id: ha_time
  user_name: "Home Assistant"
  pairing_timeout: 120s
  language: ${language}
  privacy: false
  # After a restart the ESP waits supervision_timeout + 8 s before connecting,
  # so the panel has dropped the old link (otherwise panel 3.5.x may refuse it
  # until power-cycled). / Nach einem Neustart wartet der ESP, bis das Panel die
  # alte Verbindung aufgegeben hat. Change / ändern:
  # startup_delay: 40s
  # Test option, so far not needed / Testschalter, bisher nicht nötig:
  # disconnect_on_shutdown: true

binary_sensor:
  # --- Power distribution unit (EBL, 0x0405) ---
  - platform: truma_inetx
    topic: PowerSupply
    param: MainSwitch
    address: 0x0405
    name: "${n_12v_main_switch}"
    device_id: truma_bordnetz
    device_class: power
  - platform: truma_inetx
    topic: PowerSupply
    param: DPlus
    address: 0x0405
    name: "${n_dplus}"
    device_id: truma_bordnetz
    device_class: running
  - platform: truma_inetx
    topic: PowerSupply
    param: 12VPower
    address: 0x0405
    name: "${n_12v_supply}"
    device_id: truma_bordnetz
    device_class: power
  - platform: truma_inetx
    topic: Switches
    param: Active
    address: 0x0405
    name: "${ebl_switch_output_active}"
    device_id: truma_bordnetz
    entity_category: diagnostic
  - platform: truma_inetx
    topic: FreshWater
    param: Autofill
    address: 0x0405
    name: "${fresh_water_autofill}"
    device_id: truma_bordnetz
    entity_category: diagnostic
  # --- Heater (Combi, 0x0201) ---
  - platform: truma_inetx
    topic: AirCirculation
    param: Active
    address: 0x0201
    on_values: [1]
    name: "${air_circulation_active}"
    device_id: truma_heizung
    device_class: running
  - platform: truma_inetx
    topic: EnergySrc
    param: NeedsEnergySrc
    address: 0x0201
    name: "${heater_needs_energy_source}"
    device_id: truma_heizung
    entity_category: diagnostic
  - platform: truma_inetx
    type: connected
    id: panel_connected
    name: "${panel_connected}"
    device_class: connectivity
  - platform: truma_inetx
    type: paired
    name: "${panel_paired}"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: AirHeating
    param: Active
    address: 0x0201
    on_values: [1]
    name: "${heating_active}"
    device_id: truma_heizung
    device_class: running
  - platform: truma_inetx
    topic: WaterHeating
    param: Active
    address: 0x0201
    on_values: [1]
    name: "${hot_water_active}"
    device_id: truma_heizung
    device_class: running
  - platform: truma_inetx
    topic: System
    param: FlameStatus
    on_values: [1]
    name: "${burner}"
    device_id: truma_heizung
    device_class: heat
  - platform: truma_inetx
    topic: LinePower
    param: Plugged
    address: 0x0405
    name: "${shore_power}"
    device_id: truma_bordnetz
    device_class: plug
  - platform: truma_inetx
    topic: ErrorReset
    param: ErrCode
    name: "${fault}"
    device_id: truma_panel
    device_class: problem

text_sensor:
  # --- Device firmware ---
  - platform: truma_inetx
    format: firmware
    address: 0x0101
    name: "${panel_firmware}"
    device_id: truma_panel
    entity_category: diagnostic
  - platform: truma_inetx
    format: firmware
    address: 0x0201
    name: "${heater_firmware}"
    device_id: truma_heizung
    entity_category: diagnostic
  - platform: truma_inetx
    format: firmware
    address: 0x0405
    name: "${ebl_firmware}"
    device_id: truma_bordnetz
    entity_category: diagnostic
  # --- Panel clock ---
  - platform: truma_inetx
    topic: TimeAndDate
    param: Time
    address: 0x0101
    name: "${panel_time}"
    device_id: truma_panel
    entity_category: diagnostic
  - platform: truma_inetx
    topic: TimeAndDate
    param: Date
    address: 0x0101
    name: "${panel_date}"
    device_id: truma_panel
    entity_category: diagnostic
  - platform: truma_inetx
    type: version
    name: "${firmware_version}"
    entity_category: diagnostic
  - platform: truma_inetx
    type: last_disconnect
    name: "${last_disconnect}"
    entity_category: diagnostic
  - platform: truma_inetx
    type: link_params
    name: "${radio_link}"
    entity_category: diagnostic
  - platform: truma_inetx
    type: status
    name: "${connection_status}"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: ErrorReset
    param: ErrCode
    name: "${error_codes}"
    device_id: truma_panel
    entity_category: diagnostic
  # Bluetooth module of the panel (bus address 0x0601) -- for troubleshooting
  - platform: truma_inetx
    topic: BleDeviceManagement
    param: NrFreeSlots
    address: 0x0601
    name: "${ble_free_slots}"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: BleDeviceManagement
    param: State
    address: 0x0601
    name: "${ble_module_state}"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: BleDeviceManagement
    param: BleConnState
    address: 0x0601
    name: "${ble_module_connection_state}"
    entity_category: diagnostic
  # Truma LevelControl: the name of each bottle at the panel
  - platform: truma_inetx
    topic: GasBtl
    param: Name
    instance: 1
    name: "${gas_bottle_label}"
    device_id: truma_gas_1
    icon: mdi:label-outline
    entity_category: diagnostic
  - platform: truma_inetx
    topic: GasBtl
    param: Name
    instance: 2
    name: "${gas_bottle_label}"
    device_id: truma_gas_2
    icon: mdi:label-outline
    entity_category: diagnostic
  - platform: template
    id: frost_status
    name: "${frost_status}"
    device_id: truma_heizung
    icon: mdi:snowflake-alert
    entity_category: diagnostic

button:
  - platform: truma_inetx
    type: sync_time
    name: "${set_panel_clock}"
    device_id: truma_panel
    entity_category: config
  - platform: truma_inetx
    type: pair
    name: "${pair_panel}"
    entity_category: config
  - platform: truma_inetx
    type: unpair
    name: "${remove_pairing}"
    entity_category: config
  - platform: truma_inetx
    type: reconnect
    name: "${reconnect}"
    entity_category: diagnostic
  - platform: truma_inetx
    type: dump
    name: "${dump_all_parameters_to_log}"
    entity_category: diagnostic
  - platform: truma_inetx
    type: log_raw
    name: "${log_raw_messages}"
    entity_category: diagnostic
  - platform: truma_inetx
    type: measure
    name: "${measure_tanks}"
    device_id: truma_bordnetz
  - platform: truma_inetx
    type: write
    topic: ErrorReset
    param: Req
    value: 1
    name: "${reset_fault}"
    device_id: truma_panel

climate:
  - platform: truma_inetx
    id: truma_climate
    name: "${heater}"
    device_id: truma_heizung
    supported_modes: [HEAT, FAN_ONLY]
    appliance_address: 0x0201

sensor:
  - platform: truma_inetx
    topic: AirHeating
    param: Temp
    id: room_temp
    address: 0x0201
    name: "${room_temperature}"
    device_id: truma_heizung
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  - platform: truma_inetx
    topic: WaterHeating
    param: Temp
    address: 0x0201
    name: "${water_temperature}"
    device_id: truma_heizung
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  - platform: truma_inetx
    topic: VBat
    param: Voltage
    address: 0x0405
    name: "${starter_battery}"
    device_id: truma_bordnetz
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  - platform: truma_inetx
    topic: L1Bat
    param: Voltage
    address: 0x0405
    name: "${leisure_battery}"
    device_id: truma_bordnetz
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  # NE315 Gen2 and similar units (other units: stays "unknown")
  - platform: truma_inetx
    topic: L1Bat
    param: SoC
    address: 0x0405
    name: "${leisure_battery_soc}"
    device_id: truma_bordnetz
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
  - platform: truma_inetx
    topic: L1Bat
    param: Current
    address: 0x0405
    name: "${leisure_battery_current}"
    device_id: truma_bordnetz
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01   # + = charging / Laden
  - platform: truma_inetx
    topic: L1Bat
    param: NomCapacity
    address: 0x0405
    name: "${leisure_battery_capacity}"
    device_id: truma_bordnetz
    unit_of_measurement: "Ah"
    icon: mdi:battery-high
    entity_category: diagnostic
    accuracy_decimals: 0
  - platform: truma_inetx
    topic: FreshWater
    param: Level
    address: 0x0405
    name: "${fresh_water}"
    device_id: truma_bordnetz
    unit_of_measurement: "%"
    state_class: measurement
  - platform: truma_inetx
    topic: GreyWater
    param: Level
    address: 0x0405
    name: "${grey_water}"
    device_id: truma_bordnetz
    unit_of_measurement: "%"
    state_class: measurement
  # --- Panel ---
  - platform: truma_inetx
    topic: Temperature
    param: Internal
    address: 0x0101
    name: "${panel_temperature}"
    device_id: truma_panel
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  - platform: truma_inetx
    topic: Eol
    param: Vcc12
    address: 0x0101
    name: "${panel_supply_voltage}"
    device_id: truma_panel
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic
    filters:
      - multiply: 0.001
  - platform: truma_inetx
    topic: PowerMgmt
    param: PwrMode
    address: 0x0101
    name: "${panel_power_mode}"
    device_id: truma_panel
    entity_category: diagnostic
  - platform: truma_inetx
    topic: Panel
    param: UserInactiveSince
    address: 0x0101
    name: "${panel_idle_since}"
    device_id: truma_panel
    unit_of_measurement: "s"
    entity_category: diagnostic
  # --- Heater (Combi) ---
  - platform: truma_inetx
    topic: AirHeating
    param: TgtTemp
    address: 0x0201
    name: "${heater_target_temperature}"
    device_id: truma_heizung
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  - platform: truma_inetx
    topic: RoomClimate
    param: TgtTemp
    address: 0x0101
    name: "${room_climate_target_temperature}"
    device_id: truma_heizung
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  - platform: truma_inetx
    topic: EnergySrc
    param: GasLevel
    address: 0x0201
    name: "${gas_level}"
    device_id: truma_heizung
    entity_category: diagnostic
  - platform: truma_inetx
    topic: WaterHeating
    param: FasterHeatingModeTime
    address: 0x0201
    name: "${hot_water_boost_remaining}"
    device_id: truma_heizung
    unit_of_measurement: "min"
    entity_category: diagnostic
  # --- Power distribution unit (EBL) ---
  - platform: truma_inetx
    topic: VBat
    param: State
    address: 0x0405
    name: "${starter_battery_state}"
    device_id: truma_bordnetz
    entity_category: diagnostic
  - platform: truma_inetx
    topic: L1Bat
    param: State
    address: 0x0405
    name: "${leisure_battery_state}"
    device_id: truma_bordnetz
    entity_category: diagnostic
  - platform: truma_inetx
    topic: FreshWater
    param: State
    address: 0x0405
    name: "${fresh_water_sensor_state}"
    device_id: truma_bordnetz
    entity_category: diagnostic
  - platform: truma_inetx
    topic: GreyWater
    param: State
    address: 0x0405
    name: "${grey_water_sensor_state}"
    device_id: truma_bordnetz
    entity_category: diagnostic
  - platform: wifi_signal
    name: "${wifi_signal}"
    update_interval: 60s
    entity_category: diagnostic

  # --- Truma LevelControl (gas bottles, up to two) -------------------------
  # Only if a LevelControl is registered at the iNet X panel (the level shows on
  # the panel); otherwise the values stay "unknown". "instance: 1/2" = first/second
  # bottle by bus address; the "Label" entity shows the name the bottle has at the
  # panel (e.g. "Links") so you can tell them apart.
  # Nur wenn eine LevelControl am Panel angemeldet ist, sonst bleiben die Werte leer.
  - platform: truma_inetx
    topic: GasBtl
    param: FillLevelP
    instance: 1
    name: "${gas_bottle_level}"
    device_id: truma_gas_1
    unit_of_measurement: "%"
    icon: mdi:gas-cylinder
    state_class: measurement
    accuracy_decimals: 0
  - platform: truma_inetx
    topic: GasBtl
    param: FillLevelW
    instance: 1
    name: "${gas_bottle_contents}"
    device_id: truma_gas_1
    unit_of_measurement: "kg"
    device_class: weight
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  - platform: truma_inetx
    topic: GasBtl
    param: Temperature
    instance: 1
    name: "${gas_bottle_temperature}"
    device_id: truma_gas_1
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
  - platform: truma_inetx
    topic: GasBtl
    param: FillLevelP
    instance: 2
    name: "${gas_bottle_level}"
    device_id: truma_gas_2
    unit_of_measurement: "%"
    icon: mdi:gas-cylinder
    state_class: measurement
    accuracy_decimals: 0
  - platform: truma_inetx
    topic: GasBtl
    param: FillLevelW
    instance: 2
    name: "${gas_bottle_contents}"
    device_id: truma_gas_2
    unit_of_measurement: "kg"
    device_class: weight
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  - platform: truma_inetx
    topic: GasBtl
    param: Temperature
    instance: 2
    name: "${gas_bottle_temperature}"
    device_id: truma_gas_2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

number:
  - platform: truma_inetx
    topic: Panel
    param: Intst
    address: 0x0101
    name: "${display_brightness}"
    device_id: truma_panel
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    entity_category: config
  - platform: truma_inetx
    topic: Panel
    param: DarkIntst
    address: 0x0101
    name: "${display_brightness_dark}"
    device_id: truma_panel
    min_value: 0
    max_value: 100
    step: 1
    entity_category: config
  - platform: truma_inetx
    topic: Panel
    param: DisplayTimeout
    address: 0x0101
    name: "${display_timeout}"
    device_id: truma_panel
    unit_of_measurement: "s"
    min_value: 10
    max_value: 600
    step: 10
    entity_category: config
  - platform: truma_inetx
    topic: AirCirculation
    param: FanLevel
    address: 0x0201
    name: "${fan_level}"
    device_id: truma_heizung
    min_value: 0
    max_value: 10
    step: 1
  - platform: template
    id: frost_threshold
    name: "${frost_threshold}"
    device_id: truma_heizung
    icon: mdi:snowflake-thermometer
    unit_of_measurement: "°C"
    min_value: 0
    max_value: 10
    step: 0.5
    initial_value: 5
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

select:
  - platform: truma_inetx
    topic: WaterHeating
    param: Mode
    address: 0x0201
    name: "${hot_water_mode}"
    device_id: truma_heizung
    options:
      0: "Eco (40 °C)"
      1: "Comfort (60 °C)"
      2: "Hot (70 °C)"
  - platform: truma_inetx
    topic: AirHeating
    param: Mode
    address: 0x0201
    name: "${heating_mode}"
    device_id: truma_heizung
    options:
      0: "${opt_fast}"
      1: "${opt_comfort}"

switch:
  - platform: truma_inetx
    topic: WaterHeating
    param: Active
    address: 0x0201
    name: "${hot_water}"
    device_id: truma_heizung
  - platform: truma_inetx
    topic: WaterHeating
    param: FasterHeatingMode
    address: 0x0201
    name: "${hot_water_boost}"
    device_id: truma_heizung
  - platform: truma_inetx
    topic: Switches
    param: FreshWaterPump
    address: 0x0405
    name: "${water_pump}"
    device_id: truma_bordnetz
  - platform: truma_inetx
    topic: Panel
    param: Screensaver
    address: 0x0101
    name: "${screensaver}"
    device_id: truma_panel
    entity_category: config
  # Frost protection (runs on the ESP, also without Home Assistant)
  - platform: template
    id: frost_guard
    name: "${frost_guard}"
    device_id: truma_heizung
    icon: mdi:snowflake-thermometer
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      - text_sensor.template.publish:
          id: frost_status
          state: "${frost_ready}"
    on_turn_off:
      - text_sensor.template.publish:
          id: frost_status
          state: "${frost_off}"
  - platform: template
    id: frost_auto_off
    name: "${frost_auto_off}"
    device_id: truma_heizung
    icon: mdi:fire-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config

# ---------------------------------------------------------------------------
# Frost protection / Frostschutz: if the heater is off and the room temperature
# stays below the threshold for 10 minutes, the ESP sets the heater to HEAT 5 °C.
# Works without Home Assistant (needs the panel link). Only acts while the heater
# is off – a heating set by hand is never touched.
# With "Auto Off" on, the ESP switches the heater off again once the room reaches
# 5 °C (only a heating it started itself) – saves gas, the heater cycles instead.
# Turn "${frost_guard}" off when the vehicle is winterized and the heater is meant to stay off.
# ---------------------------------------------------------------------------
globals:
  - id: frost_minutes
    type: int
    restore_value: no
    initial_value: "0"
  - id: frost_active
    type: bool
    restore_value: no
    initial_value: "false"

interval:
  - interval: 60s
    then:
      - lambda: |-
          if (id(frost_status).state.empty())
            id(frost_status).publish_state(id(frost_guard).state ? "${frost_ready}" : "${frost_off}");
          const float t = id(room_temp).state;
          auto *cl = id(truma_climate);
          const bool heater_off = cl->mode == climate::CLIMATE_MODE_OFF;
          auto stamp = [&](const char *word) {
            char buf[64];
            auto now = id(ha_time).now();
            if (now.is_valid())
              snprintf(buf, sizeof(buf), "%s %02d:%02d · %.1f °C", word, now.hour, now.minute, t);
            else
              snprintf(buf, sizeof(buf), "%s · %.1f °C", word, t);
            id(frost_status).publish_state(buf);
          };
          // Heating started by frost protection: optionally switch it off again once 5 °C is reached.
          if (id(frost_active)) {
            if (!id(frost_guard).state || cl->mode != climate::CLIMATE_MODE_HEAT ||
                std::fabs(cl->target_temperature - 5.0f) > 0.05f) {
              id(frost_active) = false;  // changed by hand -> hands off
            } else if (id(frost_auto_off).state && id(panel_connected).state && !std::isnan(t) && t >= 5.0f) {
              ESP_LOGW("frost", "Frost protection: %.1f °C reached -> heater OFF", t);
              auto call = cl->make_call();
              call.set_mode(climate::CLIMATE_MODE_OFF);
              call.perform();
              id(frost_active) = false;
              id(frost_minutes) = 0;
              stamp("${frost_done}");
            }
            return;
          }
